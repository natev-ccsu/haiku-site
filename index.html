<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f1eb">
    <meta name="description" content="A quiet reading of Ezra Pound's In a Station of the Metro.">
    <title>In a Station of the Metro — Haiku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <header class="site-header">
        <a class="wordmark" href="#home" aria-label="Haiku home">
            <span>Haiku.Me</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="#poem">The poem</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main id="home">
        <section class="hero" id="poem" aria-labelledby="poem-title">
            <div class="poem-panel">
                <p class="eyebrow"><span class="eyebrow-line"></span>Recent Posts</p>
                <h1 id="poem-title">In a Station<br>of the <span>Metro</span></h1>
                <p id="author-name">A poem by Ezra Pound</p>
                <div class="poem-copy">
                    <p>The apparition of these faces in the crowd;</p>
                    <p>Petals on a wet, black bough.</p>
                </div>
                <div class="poem-meta">
                    <span class="meta-rule"></span>

                </div>
                <a class="read-link" href="#about">
                    About the poem
                    <span class="read-link-icon" aria-hidden="true">↓</span>
                </a>
            </div>

            <figure class="image-panel">
                <img src="images/Haiku_image.png" alt="A rain-soaked metro platform at night, its lights reflected across the tracks">
                    <span class="caption-dot"></span>
                    Between arrivals
                </figcaption>
                <span class="image-index" aria-hidden="true">01 / 01</span>
            </figure>
        </section>
    </main>

    <footer class="site-footer">
